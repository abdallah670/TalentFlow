<main class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant flex flex-col min-h-[600px] overflow-hidden">
<!-- Header -->
<header class="p-lg border-b border-outline-variant bg-surface-container-lowest sticky top-0 z-10">
<div class="flex items-center justify-between mb-lg">
<div>
<h1 class="font-h1 text-h1 text-primary font-bold">TalentFlow</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Select a workspace to continue</p>
</div>
<div class="w-12 h-12 rounded-full overflow-hidden border border-outline-variant bg-surface-container-high">
<img alt="Administrator Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a corporate user looking friendly and confident. Clear lighting, high resolution, modern office background slightly blurred. The style is clean, corporate, and polished, fitting a modern HR software aesthetic with a primary color palette of deep blues and bright whites." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDddlWla1hhRDBBc4EV77O2bBzrOfQXloGhzFN_h-ih7ovH1ThEUOZHpiuGm7mfrQdwM47CN5fIJnfjogS1S7lCjyRYeYSYKJ1N46NT9Bl5oaDKbIrYDYZmbpnnQBhsQH0i-xpxVuZmhhvfVl7WZvPxa3s05oGH3UpkxEAEBXSzh80J5ddre-_0XNfeWZfLOtCvGLI6WVDkPImw8AknvoUfsfw0EAQITrZnDN7X2Mzqrgt7mrSqI8EG1aQQwwhmSlLhGaemy3lGKX0"/>
</div>
</div>
<!-- Search Bar -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">search</span>
<input class="w-full pl-xl pr-md py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body text-body text-on-surface placeholder-on-surface-variant transition-all outline-none" placeholder="Search workspaces..." type="text"/>
</div>
</header>
<!-- Workspace List -->
<div class="flex-1 overflow-y-auto p-lg bg-surface-bright space-y-md">
<!-- Workspace Card 1 -->
<button class="w-full flex items-center p-md bg-surface-container-lowest rounded-lg border border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all group text-left shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary-container/10 flex items-center justify-center mr-md shrink-0 border border-primary-container/20">
<span class="material-symbols-outlined text-primary text-xl">business</span>
</div>
<div class="flex-1">
<h2 class="font-h3 text-h3 text-on-surface group-hover:text-primary transition-colors">Acme Corp Global</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center mt-xs">
<span class="inline-flex items-center px-sm py-[2px] rounded-full bg-primary-container text-on-primary-container font-label text-label mr-sm">Admin</span>
                        1,240 active jobs
                    </p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors ml-md">chevron_right</span>
</button>
<!-- Workspace Card 2 -->
<button class="w-full flex items-center p-md bg-surface-container-lowest rounded-lg border border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all group text-left shadow-sm">
<div class="w-12 h-12 rounded-lg bg-tertiary-container/10 flex items-center justify-center mr-md shrink-0 border border-tertiary-container/20">
<span class="material-symbols-outlined text-tertiary text-xl">rocket_launch</span>
</div>
<div class="flex-1">
<h2 class="font-h3 text-h3 text-on-surface group-hover:text-primary transition-colors">TechFlow Startups</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center mt-xs">
<span class="inline-flex items-center px-sm py-[2px] rounded-full bg-surface-variant text-on-surface-variant font-label text-label mr-sm">Recruiter</span>
                        42 active jobs
                    </p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors ml-md">chevron_right</span>
</button>
<!-- Workspace Card 3 -->
<button class="w-full flex items-center p-md bg-surface-container-lowest rounded-lg border border-outline-variant hover:border-primary hover:bg-surface-container-low transition-all group text-left shadow-sm">
<div class="w-12 h-12 rounded-lg bg-secondary-container/10 flex items-center justify-center mr-md shrink-0 border border-secondary-container/20">
<span class="material-symbols-outlined text-secondary text-xl">medication</span>
</div>
<div class="flex-1">
<h2 class="font-h3 text-h3 text-on-surface group-hover:text-primary transition-colors">HealthPlus Network</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center mt-xs">
<span class="inline-flex items-center px-sm py-[2px] rounded-full bg-surface-variant text-on-surface-variant font-label text-label mr-sm">Viewer</span>
                        856 active jobs
                    </p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors ml-md">chevron_right</span>
</button>
<!-- Create New Workspace Action -->
<button class="w-full flex items-center p-md bg-transparent rounded-lg border border-dashed border-outline hover:border-primary hover:bg-surface-container-low transition-all group text-left mt-lg">
<div class="w-12 h-12 rounded-lg bg-surface-variant/50 flex items-center justify-center mr-md shrink-0 group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">add</span>
</div>
<div class="flex-1">
<h2 class="font-h3 text-h3 text-on-surface-variant group-hover:text-primary transition-colors">Create New Workspace</h2>
</div>
</button>
</div>
<!-- Footer -->
<footer class="p-md border-t border-outline-variant bg-surface-container-lowest flex justify-center">
<button class="flex items-center text-on-surface-variant hover:text-error transition-colors font-label text-label px-md py-sm rounded-lg hover:bg-error-container/20">
<span class="material-symbols-outlined mr-sm text-[18px]">logout</span>
                Logout
            </button>
</footer>
