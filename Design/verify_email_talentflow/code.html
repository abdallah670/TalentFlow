        body {
            background-image: radial-gradient(var(--tw-colors-surface-variant) 1px, transparent 1px);

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md md:p-gutter antialiased">
<!-- Linear/Transactional Page: Global Navigation is intentionally suppressed. -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden flex flex-col items-center text-center">
<!-- Branding Header -->
<header class="w-full py-lg px-xl border-b border-outline-variant/50 flex justify-center items-center gap-sm">
<span class="material-symbols-outlined text-primary-container" style="font-size: 28px; font-variation-settings: 'FILL' 1;">all_inclusive</span>
<span class="font-h2 text-h2 text-primary font-bold tracking-tight">TalentFlow</span>
</header>
<div class="px-xl py-xl w-full flex flex-col items-center">
<!-- Illustration -->
<div class="w-48 h-48 mb-lg rounded-full overflow-hidden border-4 border-surface-container-low bg-surface-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A sophisticated, minimalist 3D rendering of an open envelope with a bright glowing checkmark hovering above it. The scene is illuminated by soft, high-key studio lighting, emphasizing a clean white and deep navy blue (#3F51B5) color palette. The aesthetic is modern corporate, conveying reliable efficiency and successful digital transmission. High-resolution, precise geometry." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAigRuKwe3oVh0LhPo1wC1_NrmuHPwKSdwymFXOSJElrJvIUvzvUqUE1ifZFSmFtqKapf_uZvdRswpB6IKdLNrwbz1VowYtvWZYNWuPEJDh6MegnFs6BFj79ONwWJSR7AIuoBHrtQjyKTB-wWa0-jEqigYO-IffrEW0KzjwmyqBpSW_2eNMgevnVrU5tSPpbnz6Kz2ionyD-1mGIwT0KjLb1KnsUPKrx7pEMEXxeL0sphYm85MIVYHK0QyAjQtfT87pSfNxCVJkGYc">
</div>
<!-- Content -->
<h1 class="font-h1 text-h1 text-on-surface mb-md">Check your inbox</h1>
<p class="font-body text-body text-on-surface-variant mb-xl max-w-[320px]">
                We've sent a verification link to your email. Please click the link to activate your account.
            </p>
<!-- Actions -->
<div class="flex flex-col gap-sm w-full max-w-[320px]">
<button class="w-full bg-primary-container text-on-primary font-label text-label py-sm px-lg rounded flex items-center justify-center gap-sm hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">outgoing_mail</span>
                    Resend Email
                </button>
<button class="w-full border border-outline text-primary font-label text-label py-sm px-lg rounded flex items-center justify-center hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                    Change Email
                </button>
</div>
</div>
<!-- Footer / Support Context -->
<footer class="w-full py-md px-xl bg-surface-container-lowest border-t border-outline-variant/50">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Didn't receive the email? Check your spam folder or <a class="text-primary-container hover:underline font-medium" href="#">contact IT support</a>.
            </p>
</footer>
</main>
