<nav class="sidebar">
  <div class="sidebar-header">
    <h2 class="sidebar-title">Onboarding</h2>
    <p class="sidebar-subtitle">Setup progress</p>
  </div>

  <div class="sidebar-nav">
    @for (step of steps; track step.id) {
      <button type="button" class="step-item"
        [class.is-current]="currentStep() === step.id"
        [class.is-past]="currentStep() > step.id"
        [class.is-future]="currentStep() < step.id"
        [class.is-locked]="step.id > currentStep() && !canGoTo(step.id)"
        [disabled]="step.id > currentStep() && !canGoTo(step.id)"
        (click)="goTo(step.id)"
        [attr.aria-label]="'Go to ' + step.title">
        <span class="nav-icon material-symbols-outlined" [class.completed]="currentStep() > step.id">
          @if (currentStep() > step.id) {
            check_circle
          } @else {
            {{ iconFor(step.id) }}
          }
        </span>
        <span class="nav-label">{{ step.title }}</span>
      </button>
    }
  </div>

  <div class="sidebar-footer" routerLink="/home">
    <div class="logo-wrapper">
      <span class="logo-icon material-symbols-outlined">group_work</span>
    </div>
    <span class="logo-text">TalentFlow</span>
  </div>
</nav>
