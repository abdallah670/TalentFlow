<aside class="sidebar">
   <div class="branding">
      <h1 class="logo">TalentFlow</h1>
      <p class="tagline">Enterprise HR Recruitment</p>
   </div>
   <nav class="stepper">
      @for (step of steps; track step.id; let last = $last) {
        <button
          type="button"
          class="step-item"
          [class.is-past]="currentStep() > step.id"
          [class.is-current]="currentStep() === step.id"
          [class.is-future]="currentStep() < step.id"
          [class.is-locked]="!canGoTo(step.id)"
          [disabled]="!canGoTo(step.id)"
          (click)="goTo(step.id)"
          [attr.aria-label]="'Go to ' + step.title">
          @if (!last) {
             <div class="step-connector"></div>
          }
          <div class="step-circle">
             @if (currentStep() > step.id) {
                <span class="material-symbols-outlined check-icon">check</span>
             } @else {
                <span class="step-number">{{step.id}}</span>
             }
          </div>
          <div class="step-labels">
            <span class="step-label">{{step.label}}</span>
            <span class="step-title">{{step.title}}</span>
          </div>
        </button>
      }
    </nav>
    <div class="background-pattern">
       <div class="bg-image"></div>
    </div>
    <div class="sidebar-footer" routerLink="/home">
    <div class="logo-wrapper">
      <span class="logo-icon material-symbols-outlined">group_work</span>
    </div>
    <span class="logo-text">TalentFlow</span>
  </div>

</aside>
