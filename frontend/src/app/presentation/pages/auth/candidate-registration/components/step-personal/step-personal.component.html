<div class="step-header">
  <span class="step-subtitle">Step 1 of 4</span>
  <h2 class="step-title">Create Account</h2>
</div>

<div class="card">
  <p class="card-description">Enter your details to get started.</p>
  
  <form class="space-y-4">
      <div class="form-grid">
        <div class="form-group">
            <input type="text" id="firstName" name="firstName" placeholder=" " class="form-input">
            <label for="firstName" class="form-label">First Name</label>
        </div>
        <div class="form-group">
            <input type="text" id="lastName" name="lastName" placeholder=" " class="form-input">
            <label for="lastName" class="form-label">Last Name</label>
        </div>
      </div>
      
      <div class="form-group">
        <input type="email" id="email" name="email" placeholder=" " class="form-input">
        <label for="email" class="form-label">Email Address</label>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" name="password" placeholder=" " class="form-input has-icon">
        <label for="password" class="form-label">Password</label>
        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>
      
      <div class="form-group">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder=" " class="form-input">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="privacy" class="checkbox">
        <label for="privacy" class="checkbox-label">I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>.</label>
      </div>
      
      <div class="info-box">
        <span class="material-symbols-outlined info-icon">mail</span>
        <p class="info-text">A verification email will be sent to the address provided upon account creation.</p>
      </div>
  </form>
</div>
