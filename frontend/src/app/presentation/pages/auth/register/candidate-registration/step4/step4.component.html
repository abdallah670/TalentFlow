<div class="step4-page">
  <div class="step4-layout">
    <!-- Sidebar Progress (Desktop) -->
    <div class="step4-sidebar">
      <div class="step4-sidebar-brand">
        <h2>TalentFlow</h2>
        <p>Candidate Onboarding</p>
      </div>
      <nav class="step4-progress">
        <ol>
          <li class="completed">
            <div class="progress-dot"><span class="material-symbols-outlined">check</span></div>
            <span>Basic Info</span>
          </li>
          <li class="completed">
            <div class="progress-dot"><span class="material-symbols-outlined">check</span></div>
            <span>Experience</span>
          </li>
          <li class="completed">
            <div class="progress-dot"><span class="material-symbols-outlined">check</span></div>
            <span>Resume & Skills</span>
          </li>
          <li class="active">
            <div class="progress-dot">4</div>
            <span>Preferences</span>
          </li>
        </ol>
      </nav>
    </div>

    <!-- Form Panel -->
    <div class="step4-form-panel">
      <div class="step4-form-header">
        <h2>Preferences</h2>
        <p>Tell us about your ideal role and work preferences.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="preferredLocation">Preferred Location</label>
          <input id="preferredLocation" type="text" formControlName="preferredLocation" placeholder="City, State or Remote" />
        </div>

        <div class="form-group">
          <div class="toggle-group">
            <label for="remoteOnly">Remote Only</label>
            <input id="remoteOnly" type="checkbox" formControlName="remoteOnly" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="salaryExpectationMin">Min Salary</label>
            <input id="salaryExpectationMin" type="number" formControlName="salaryExpectationMin" placeholder="50000" />
          </div>
          <div class="form-group">
            <label for="salaryExpectationMax">Max Salary</label>
            <input id="salaryExpectationMax" type="number" formControlName="salaryExpectationMax" placeholder="100000" />
          </div>
        </div>

        <div class="form-group">
          <label for="currency">Currency</label>
          <select id="currency" formControlName="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>

        <div class="form-group">
          <label for="availableFrom">Available From</label>
          <input id="availableFrom" type="date" formControlName="availableFrom" />
        </div>

        <div class="form-group">
          <label for="workAuthorization">Work Authorization</label>
          <select id="workAuthorization" formControlName="workAuthorization">
            <option value="">Select</option>
            <option value="Citizen">Citizen</option>
            <option value="Visa">Visa</option>
            <option value="SponsorshipNeeded">Sponsorship Needed</option>
          </select>
        </div>

        <div class="step4-actions">
          <button type="button" class="btn-secondary" (click)="onBack()">Back</button>
          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid">
            Complete Registration
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
