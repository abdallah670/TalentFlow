<div class="step2-page">
  <div class="step2-layout">
    <!-- Left Branding Panel (Desktop) -->
    <div class="step2-branding">
      <div class="step2-branding-content">
        <h1>TalentFlow</h1>
        <p>Enterprise HR Recruitment</p>
      </div>
      <div class="step2-branding-footer">
        <h2>Build your professional narrative.</h2>
        <p>Step 2 focuses on your recent experience and online presence to help our algorithms match you with the perfect role.</p>
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="step2-form-panel">
      <div class="step2-form-header">
        <span class="step2-step-label">Step 2 of 4</span>
        <h2>Professional Profile</h2>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input id="phoneNumber" type="tel" formControlName="phoneNumber" placeholder="+1 (555) 000-0000" />
        </div>

        <div class="form-group">
          <label for="currentJobTitle">Current Job Title</label>
          <input id="currentJobTitle" type="text" formControlName="currentJobTitle" placeholder="Software Engineer" />
        </div>

        <div class="form-group">
          <label for="currentCompany">Current Company</label>
          <input id="currentCompany" type="text" formControlName="currentCompany" placeholder="Acme Corp" />
        </div>

        <div class="form-group">
          <label for="totalYearsOfExperience">Total Years of Experience</label>
          <input id="totalYearsOfExperience" type="number" formControlName="totalYearsOfExperience" placeholder="5" min="0" max="50" />
        </div>

        <div class="form-group">
          <label for="linkedinUrl">LinkedIn URL</label>
          <input id="linkedinUrl" type="url" formControlName="linkedinUrl" placeholder="https://linkedin.com/in/username" />
        </div>

        <div class="form-group">
          <label for="portfolioUrl">Portfolio / GitHub URL</label>
          <input id="portfolioUrl" type="url" formControlName="portfolioUrl" placeholder="https://github.com/username" />
        </div>

        <div class="step2-actions">
          <button type="button" class="btn-secondary" (click)="onBack()">Back</button>
          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid">
            Save & Continue
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
