<div class="candidate-registration">
  <!-- Header / Stepper -->
  <header class="candidate-registration-header">
    <div class="candidate-registration-brand">
      <span class="material-symbols-outlined filled" style="color: var(--primary);">group</span>
      <span>TalentFlow</span>
    </div>
    <div class="candidate-registration-stepper">
      @for (step of steps; track step.route; let i = $index) {
        <div class="stepper-step" [class.completed]="i < currentStepIndex" [class.active]="i === currentStepIndex">
          <div class="stepper-circle">
            @if (i < currentStepIndex) {
              <span class="material-symbols-outlined" style="font-size: 16px;">check</span>
            } @else {
              <span>{{ i + 1 }}</span>
            }
          </div>
          <span class="stepper-label">{{ step.label }}</span>
        </div>
      }
    </div>
  </header>

  <!-- Router Outlet for Steps -->
  <main class="candidate-registration-main">
    <router-outlet></router-outlet>
  </main>
</div>
