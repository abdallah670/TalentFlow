<div class="register-page">
  <div class="register-blob-1"></div>
  <div class="register-blob-2"></div>

  <div class="register-card">
    <div class="register-header">
      <h1>TalentFlow</h1>
      <p>Start your 14-day trial. No credit card required.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="register-icon-input">
        <span class="material-symbols-outlined input-icon">person</span>
        <input id="firstName" type="text" formControlName="firstName" placeholder="Full Name" />
      </div>

      <div class="register-icon-input">
        <span class="material-symbols-outlined input-icon">mail</span>
        <input id="email" type="email" formControlName="email" placeholder="Work Email" />
      </div>

      <div class="register-icon-input">
        <span class="material-symbols-outlined input-icon">business</span>
        <input id="companyName" type="text" formControlName="companyName" placeholder="Company Name" />
      </div>

      <div class="register-icon-input">
        <span class="material-symbols-outlined input-icon">lock</span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="Create a strong password"
        />
        <button type="button" class="password-toggle" (click)="togglePassword()">
          <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>

      @if (registerForm.get('password')?.touched) {
        <div class="password-strength">
          <div class="password-strength-bar" [class.weak]="getPasswordStrength() >= 1"></div>
          <div class="password-strength-bar" [class.medium]="getPasswordStrength() >= 2"></div>
          <div class="password-strength-bar" [class.strong]="getPasswordStrength() >= 3"></div>
          <div class="password-strength-bar" [class.very-strong]="getPasswordStrength() >= 4"></div>
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
        } @else {
          <span>Create Account</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        }
      </button>
    </form>

    <div class="divider"><span>OR</span></div>

    <button class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign up with Google
    </button>

    <div class="auth-link">
      Already have an account? <a routerLink="/login">Log in</a>
    </div>
  </div>
</div>
