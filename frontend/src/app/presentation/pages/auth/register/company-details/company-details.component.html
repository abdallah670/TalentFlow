<div class="company-details-page">
  <div class="company-details-card">
    <div class="company-details-header">
      <div class="company-details-brand">
        <span class="material-symbols-outlined filled">corporate_fare</span>
        <span>TalentFlow</span>
      </div>
      <h1>Set up your company profile</h1>
      <p>Step 2 of 3: Provide details about your organization.</p>
      <div class="progress-indicators">
        <div class="progress-bar completed"></div>
        <div class="progress-bar active"></div>
        <div class="progress-bar pending"></div>
      </div>
    </div>

    <div class="company-details-form">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="companyName">Company Name *</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined">apartment</span>
            <input id="companyName" type="text" formControlName="companyName" placeholder="e.g., Acme Corporation" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="companySize">Company Size *</label>
            <div class="input-with-icon">
              <span class="material-symbols-outlined">groups</span>
              <select id="companySize" formControlName="companySize">
                <option value="">Select size</option>
                <option value="1-10">1-10 employees</option>
                <option value="11-50">11-50 employees</option>
                <option value="51-200">51-200 employees</option>
                <option value="201-500">201-500 employees</option>
                <option value="501-1000">501-1,000 employees</option>
                <option value="1000+">1,000+ employees</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="industry">Industry *</label>
            <div class="input-with-icon">
              <span class="material-symbols-outlined">domain</span>
              <select id="industry" formControlName="industry">
                <option value="">Select industry</option>
                <option value="tech">Technology</option>
                <option value="finance">Finance & Banking</option>
                <option value="healthcare">Healthcare</option>
                <option value="manufacturing">Manufacturing</option>
                <option value="retail">Retail</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="websiteUrl">Company Website URL</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined">language</span>
            <input id="websiteUrl" type="url" formControlName="websiteUrl" placeholder="https://www.example.com" />
          </div>
        </div>

        <div class="form-group">
          <label for="linkedinUrl">LinkedIn Company URL</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined">link</span>
            <input id="linkedinUrl" type="url" formControlName="linkedinUrl" placeholder="https://linkedin.com/company/..." />
          </div>
        </div>

        <div class="form-group">
          <label for="officeLocation">Primary Office Location *</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined">location_on</span>
            <input id="officeLocation" type="text" formControlName="officeLocation" placeholder="City, State, Country" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="onBack()">Back</button>
          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid">
            Continue
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
