<div class="step-header">
  <span class="step-subtitle">Step 2 of 4</span>
  <h2 class="step-title">Professional Profile</h2>
</div>

<div class="cards-container">
  <div class="card">
      <h3 class="card-title">Contact Information</h3>
      <div class="form-group">
        <label for="phoneNumber" class="form-label">Phone Number</label>
        <div class="phone-input-group">
            <div class="country-selector">
              <span class="text-[18px]">🇺🇸</span>
              <span class="text-[15px] text-[#454652] ml-1">+1</span>
              <span class="material-symbols-outlined text-[20px] text-[#757684]">arrow_drop_down</span>
            </div>
            <input type="tel" id="phoneNumber" placeholder="(555) 000-0000" class="phone-input">
        </div>
      </div>
  </div>
  
  <div class="card">
      <h3 class="card-title">Current Role</h3>
      <div class="form-grid">
        <div class="form-group">
            <label for="jobTitle" class="form-label">Current Job Title</label>
            <input type="text" id="jobTitle" placeholder="e.g. Senior Software Engineer" class="form-input">
        </div>
        <div class="form-group">
            <label for="company" class="form-label">Current Company</label>
            <input type="text" id="company" placeholder="e.g. Acme Corp" class="form-input">
        </div>
      </div>
  </div>
  
  <div class="two-col-cards">
      <div class="experience-card">
          <span class="material-symbols-outlined bg-icon">trending_up</span>
          <h3 class="title">Total Experience</h3>
          <p class="description">Years of professional experience.</p>
          <div class="form-group relative z-10">
            <label for="yearsExperience" class="form-label">Years (Numeric)</label>
            <input type="number" id="yearsExperience" placeholder="0" class="form-input">
          </div>
      </div>
      
      <div class="add-card" tabindex="0" role="button">
          <span class="material-symbols-outlined text-[32px] mb-2 text-[#c5c5d4]">assignment_add</span>
      </div>
  </div>
  
  <div class="card">
      <h3 class="card-title">Online Presence</h3>
      <div class="url-group">
        <div class="form-group">
            <label for="linkedinUrl" class="form-label">LinkedIn URL</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">link</span>
              <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/username" class="url-input">
            </div>
        </div>
        <div class="form-group">
            <label for="githubUrl" class="form-label">Portfolio / GitHub URL</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">code</span>
              <input type="url" id="githubUrl" placeholder="https://github.com/username" class="url-input">
            </div>
        </div>
      </div>
  </div>
</div>
